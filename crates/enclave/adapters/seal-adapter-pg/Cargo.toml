[package]
name = "seal-adapter-pg"
description = "Postgres: client cleartext-password auth (the token), upstream SCRAM-SHA-256 over TLS, then relay"
version.workspace = true
edition.workspace = true
license.workspace = true
# Runs inside Seal's own images; never published.
publish = false

[dependencies]
seal-proto.workspace = true
seal-adapter.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
postgres-protocol.workspace = true
rand.workspace = true
zeroize.workspace = true

[dev-dependencies]
seal-adapter = { workspace = true, features = ["testing"] }
# Extra roots: the test Postgres server's CA.
seal-net = { workspace = true, features = ["sim"] }
proptest.workspace = true
# Test PKI for the Postgres server in Docker, and the fake upstream's SCRAM.
p256.workspace = true
x509-cert.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
