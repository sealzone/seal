[package]
name = "seal-nitro-host"
description = "The parent-instance side of an AWS Nitro enclave replica: the tenant pin and deployment proof over vsock, egress (CONNECT host:port) and the inbound port. Untrusted, like any host."
version.workspace = true
edition.workspace = true
license.workspace = true
# Runs on the customer's EC2 parent instance, beside the enclave; never published.
publish = false

[[bin]]
name = "seal-nitro-host"

[dependencies]
seal-proto.workspace = true
seal-net.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# IMDSv2, over plain HTTP on the instance.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
# The presigned GetCallerIdentity: SigV4 key derivation and signature (as seal-client's `aws`).
aws-sigv4.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
url.workspace = true
# The enclave's own side of the protocol, against this one.
seal-cloud = { workspace = true, features = ["sim"] }
seal-tee = { workspace = true, features = ["sim"] }
seal-authz.workspace = true
