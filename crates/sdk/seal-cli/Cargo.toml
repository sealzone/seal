[package]
name = "sealzone-cli"
description = "The `seal` command: seal secrets, administer a Seal tenant (apps, deployments, integrity), verify telemetry, deploy enclaves."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["secrets", "tee", "attestation", "enclave", "cli"]
categories = ["command-line-utilities", "cryptography", "authentication"]

[lib]
name = "seal_cli"
path = "src/lib.rs"

[[bin]]
name = "seal"
path = "src/main.rs"

[features]
default = ["passkey"]
sim = ["seal-client/sim"]
# Signing with a security key (`seal changes sign --passkey`); on Linux it builds against
# libudev (libudev-dev, systemd-devel or eudev-dev).
passkey = ["dep:ctap-hid-fido2"]

[dependencies]
seal-proto.workspace = true
seal-crypto.workspace = true
seal-client.workspace = true
seal-verify.workspace = true
seal-attest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
anstyle.workspace = true
keyring.workspace = true
async-trait.workspace = true
rpassword.workspace = true
ctap-hid-fido2 = { workspace = true, optional = true }
anyhow.workspace = true
jiff.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
# `seal deploy`: the Azure policy's SHA-256 (host_data) and base64 in ARM templates.
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
# A software passkey for the security-key signing tests.
p256.workspace = true
# In-process dev log and a fake control plane behind TLS for the end-to-end tests.
seal-tlog = { workspace = true, features = ["dev"] }
axum.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
