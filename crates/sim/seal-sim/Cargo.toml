[package]
name = "seal-sim"
description = "The local simulator harness: sets up a release, a guardian, a control plane and an enclave on localhost, and drives the end-to-end flow."
version.workspace = true
edition.workspace = true
license.workspace = true
# Development only: dev release keys, a test CA, a TLS proxy and a test upstream; never shipped.
publish = false

[features]
# Everything here is sim-only. Without the feature only the app and its HTTP client build, so workspace builds
# without `--features` never turn on the SDK's `sim` feature through it.
sim = ["seal-client/sim", "seal-tlog/dev"]

[[bin]]
name = "seal-sim"
required-features = ["sim"]

[[test]]
name = "host_agent"
required-features = ["sim"]

[dependencies]
seal-proto.workspace = true
seal-crypto.workspace = true
seal-tlog.workspace = true
seal-verify.workspace = true
seal-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
base64.workspace = true
sha2.workspace = true
url.workspace = true
clap.workspace = true
anyhow.workspace = true
