[package]
name = "seal-release"
description = "Release tooling for developers: measurements, Azure container policies, signed and logged release manifests, and an SDK app that exercises a live deployment."
version.workspace = true
edition.workspace = true
license.workspace = true
# Development only: signs with keys on the developer's machine; never shipped. No `sim`
# feature: it drives production builds of the SDK.
publish = false

[[bin]]
name = "seal-release"

[dependencies]
seal-proto.workspace = true
seal-crypto.workspace = true
seal-attest.workspace = true
seal-client.workspace = true
# The Key Vault release policy, exactly as the guardian checks it.
seal-guardian.workspace = true
seal-sim.workspace = true
seal-tlog.workspace = true
seal-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
sha2.workspace = true
url.workspace = true
clap.workspace = true
anyhow.workspace = true
# guardian-identity straight to a guardian over plain HTTP.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
regex = "1"
